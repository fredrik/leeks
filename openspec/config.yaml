schema: spec-driven

context: |
  leeks is a music library organiser, spiritual successor to beets.
  Album-centric and top-down: albums are real entities, not derived
  from files. Layered metadata sources with precedence (file tags,
  MusicBrainz, tracker metadata). Append-mostly history of every
  change — like git for your music library's metadata.

  Stack: Python >=3.14, uv, hatchling, click, SQLAlchemy 2.0 + SQLite,
  Alembic, Pydantic v2, mediafile, musicbrainzngs.

  Boundary rule: Pydantic models (TrackInfo, AlbumInfo) are the
  pipeline lingua franca. SQLAlchemy ORM models are persistence only.
  These layers never leak into each other.

  Tooling: ruff, ty, pytest. uv-first — never pip.
