schema: spec-driven

context: |
  leeks is a music library organiser and spiritual successor to beets.
  Tech stack: Python, managed with uv. Source lives in src/leeks.
  Design principles: keep it simple; don't add when you can delete.
  Decisions are recorded as ADRs in docs/adr; design docs in docs/design.
  Tests must run fast — the feedback loop should be as tight as possible.
