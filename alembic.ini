# Alembic CLI configuration. The url is left blank: env.py defaults to the
# library database (respecting $LEEKS_ROOT), so `uv run alembic ...` works
# against whatever library you point it at.

[alembic]
# Migrations live in the package, not the repo root, so they ship with the wheel.
script_location = src/leeks/migrations
sqlalchemy.url =
