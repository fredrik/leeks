# album's claim is a set, not a scalar. It exercises set-valued claims (one
# source_values row per genre) and `show`'s genres list with real data.
# Genre is a list here; the other albums keep a bare string. Keep all tracks'
# genres identical, or whole-set consensus (ADR 0022) claims nothing.
# ---------------------------------------------------------------------------
[[albums]]
